name: Backfill benchmark history

on:
  workflow_dispatch:
    inputs:
      commits:
        description: Number of mainline commits, including the end revision (1-100)
        default: 100
        type: number
      end_revision:
        description: Newest Strawberry commit; resolved once before batching
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: benchmark-history-backfill
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.plan.outputs.revision }}
      batches: ${{ steps.plan.outputs.batches }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: strawberry-graphql/strawberry
          ref: main
          path: strawberry
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14.7"
      - id: plan
        env:
          HISTORY_COMMITS: ${{ inputs.commits }}
          HISTORY_REF: ${{ inputs.end_revision }}
        run: uv run --locked python -m scripts.backfill plan --source strawberry
  measure:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        batch: ${{ fromJSON(needs.plan.outputs.batches) }}
    concurrency:
      group: native-benchmarks
      cancel-in-progress: false
    name: Historical batch ${{ matrix.batch }} (Python 3.14.7)
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Each serial backfill batch must see the preceding batch's saved data.
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: strawberry-graphql/strawberry
          ref: main
          path: strawberry
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            strawberry/uv.lock
          python-version: "3.14.7"
      - run: uv sync --locked
      - name: Measure pending releases and main
        id: measure
        continue-on-error: true
        env:
          INCLUDE_STRESS: true
          HISTORY_COMMITS: ${{ inputs.commits || 0 }}
          HISTORY_REF: ${{ needs.plan.outputs.revision }}
          HISTORY_BATCH: ${{ matrix.batch || 0 }}
        run: |
          if [ "$HISTORY_COMMITS" != 0 ]; then
            uv run --no-sync python -m scripts.backfill run --source strawberry
          else
            uv run --no-sync python -m scripts.run_benchmarks --source strawberry
          fi
      - name: Generate ASV charts from verified measurements
        id: publish
        if: ${{ !cancelled() && steps.measure.outcome != 'skipped' }}
        run: uv run --no-sync python -m scripts.dashboard publish --source strawberry
      - name: Upload measurements, diagnostics and dashboard
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-walltime-py3.14.7${{ inputs.commits > 0 && format('-history-{0}', matrix.batch) || '' }}
          path: |
            benchmark-artifacts/
            results/
            records/
            html/
          if-no-files-found: error
          retention-days: 90
      - name: Retain results and publish through the existing site deployment
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.publish.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add results records html
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c commit.gpgsign=false commit -m 'Update native benchmark charts'
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" push origin HEAD:main
      - name: Report measurement outcome
        if: always()
        env:
          MEASUREMENT_OUTCOME: ${{ steps.measure.outcome }}
        run: |
          echo '### Native wall-clock charts' >> "$GITHUB_STEP_SUMMARY"
          echo 'ASV charts show median seconds per callback. Compare matching workload, Python, dependencies and hardware. Raw measurements and correctness diagnostics are attached.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Only runs on this repository’s main branch commit the generated site. Branch validation produces artifacts without publishing to production.' >> "$GITHUB_STEP_SUMMARY"
          test "$MEASUREMENT_OUTCOME" = success
  verify:
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    needs: [plan, measure]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: strawberry-graphql/strawberry
          ref: main
          path: strawberry
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14.7"
      - env:
          HISTORY_COMMITS: ${{ inputs.commits }}
          HISTORY_REF: ${{ needs.plan.outputs.revision }}
        run: uv run --locked python -m scripts.backfill verify --source strawberry
